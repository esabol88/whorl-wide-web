name: Update dispatch data

on:
  schedule:
    - cron: '0 * * * *'   # every hour — adjust as you like
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap — a normal run should take a couple minutes; this catches a real hang fast without cutting off a merely-slow-but-finishing run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: node fetch-content.js

      - name: Commit updated data.json
        run: |
          git config user.name "wolfe-dispatch-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update dispatch data"
          git push
